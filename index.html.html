<body><div class="wrap">
<header class="hero"><div class="kicker">ULTRA版・180結果＋1%虹色LR</div><h1>推しとの<br>運命診断 ULTRA</h1><p class="lead">名前と誕生日の月日だけで、あなたと推しの“縁のかたち”を診断。結果文に推しの名前が入ります。相性グラフ、推しからの架空メッセージ、SSR以上の特別演出つき。</p></header>
<section class="card"><div class="grid">
<div><label>あなたの名前</label><input id="myName" placeholder="例：そら"></div><div><label>推しの名前</label><input id="oshiName" placeholder="例：あおい"></div>
<div><label>あなたの誕生日</label><div class="birth"><select id="myMonth"></select><select id="myDay"></select></div></div>
<div><label>推しの誕生日</label><div class="birth"><select id="oshiMonth"></select><select id="oshiDay"></select></div></div>
</div><div class="actions"><button class="primary" id="diagnoseBtn">診断する</button><button class="secondary" id="sampleBtn">サンプル入力</button></div><div id="warning" class="warning"></div><p class="note">ひらがな・カタカナ推奨。漢字や英字でも診断できます。年齢非公開の推しでもOK。</p></section>
<section id="result" class="card result"><div class="resultInner">
<div class="illust" id="illust"><span id="icon">✨</span><span class="spark" style="left:16%;top:20%">✦</span><span class="spark" style="right:18%;top:28%;animation-delay:.7s">♡</span><span class="spark" style="left:30%;bottom:18%;animation-delay:1.1s">＊</span></div>

<div id="title" class="title"></div><p id="subtitle" class="subtitle"></p><div id="story" class="story"></div>

</div></section><div class="footer">Oshi Destiny Checker ULTRA</div></div>

const myv=vscore(my), osv=vscore(os), diff=bdiff(mm,md,om,od); const sync=Math.max(1,Math.min(100,Math.round(100-Math.abs(myv-osv)*6-Math.abs(len(my)-len(os))*8-Math.min(diff,140)/2))); let score=myv+osv+len(my)*10+len(os)*10+mm+md+om+od+Math.round(sync/4);
const lucky=(score*37+diff*13+myv*17+osv*19+len(my)*23+len(os)*29)%100; const isLR=lucky===7; let no=score%180; if(no===0)no=180; let item=DATA[no-1]; if(isLR)item={r:"LR",t:"虹色LR・奇跡の推し縁",tag:"伝説",icon:"🌈",sub:"1%で出る、偶然を超えた推し縁",txt:"これは通常の診断結果とは別枠で現れる、かなり珍しい虹色LRです。\n\n{me}さんと{oshi}さんの縁は、たまたま見つけた、たまたま好きになった、という偶然の形をしていながら、振り返ると不思議と一本の線でつながっているように感じられるでしょう。\n\n会える回数や距離だけでは測れません。{oshi}さんの存在が{me}さんの毎日に色を足し、{me}さんの応援がまた{oshi}さんの物語を照らしていく。そんな“奇跡っぽいけれど、ちゃんと現実にある縁”です。",view:"{oshi}さんから見た{me}さんは、忘れた頃に強く印象を残す人。派手さよりも、あたたかく残る余韻があります。",past:"前世では、同じ流星を別々の場所から見上げた二人。願いごとは違っても、見ていた光は同じでした。",month:"来月の推し運は『虹色更新の月』。予想外の供給や、あとから意味を持つ出来事に出会いやすいでしょう。",message:"{me}さん、見つけてくれてありがとう。偶然みたいな出会いでも、そこから続いていく気持ちは本物だと思います。"};
const vals={sync:sync,support:Math.min(100,55+((score+diff)%45)),luck:Math.min(100,50+(lucky%50)),memory:Math.min(100,45+((myv*osv+diff)%55)),future:Math.min(100,48+((score+sync)%52))};
const chips=hidden(my,os,diff,score,sync,isLR,item.r); current={item,my,os,score,no,diff,sync,chips,isLR,vals}; $("result").classList.toggle("rainbow",isLR); $("result").classList.toggle("ssr",["SSR","UR","LR"].includes(item.r)); $("specialNote").style.display=(isLR||["SSR","UR","LR"].includes(item.r))?"inline-flex":"none"; $("specialNote").textContent=isLR?"1%虹色LR":"SSR以上演出"; $("rarity").textContent=item.r; $("rarity").classList.toggle("lr",isLR); $("tag").textContent=item.tag+"タイプ"; $("icon").textContent=item.icon; $("title").textContent=item.t; $("subtitle").textContent=item.sub; $("story").textContent=fmt(item.txt,my,os); $("score").textContent=score; $("typeNo").textContent=isLR?"LR":no; $("diff").textContent=diff+"日"; $("sync").textContent=sync; $("secret").innerHTML=chips.map(c=>`<span class="chip">${c[0]}：${c[1]}</span>`).join(""); graph(vals); setMode("view");
$("copyText").value=`【推しとの運命診断ULTRA】\n${my} × ${os}\n\n${item.r}「${item.t}」\n${item.tag}タイプ\n${item.sub}\n\n${fmt(item.txt,my,os)}\n\n推しから見たあなた：\n${fmt(item.view,my,os)}\n\nあなたと推しの前世：\n${fmt(item.past,my,os)}\n\n来月の推し運：\n${fmt(item.month,my,os)}\n\n推しからのメッセージ：\n${fmt(item.message,my,os)}\n\n相性グラフ：\n共鳴 ${vals.sync} / 応援 ${vals.support} / 偶然 ${vals.luck} / 記憶 ${vals.memory} / 未来 ${vals.future}\n\n隠し称号：\n${chips.map(c=>"・"+c[0]).join("\n")}\n\n運命値：${score}\n共鳴値：${sync}\n誕生日の差：${diff}日`; $("result").style.display="block"; $("result").scrollIntoView({behavior:"smooth",block:"start"})}
function sample(){$("myName").value="そら";$("oshiName").value="あおい";$("myMonth").value=4;$("myDay").value=12;$("oshiMonth").value=8;$("oshiDay").value=3;diagnose()}
fill(); $("diagnoseBtn").onclick=diagnose; $("sampleBtn").onclick=sample; $("copyBtn").onclick=function(){$("copyText").select();document.execCommand("copy");alert("コピーしたよ")}; $("topBtn").onclick=function(){scrollTo({top:0,behavior:"smooth"})}; document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
});
</script></body></html>
